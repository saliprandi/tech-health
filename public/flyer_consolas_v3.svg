<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&amp;display=swap');
      .text-teal { fill: #1a535c; }
      .text-yellow { fill: #ffe66d; }
      .bg-yellow { fill: #ffe66d; }
      .bg-teal { fill: #1a535c; }
      .multiply { mix-blend-mode: multiply; }
      line, rect.stroke { stroke: #1a535c; stroke-width: 6; fill: none; }
    </style>
    <!-- Clip para la imagen cortada por diagonales o bloques -->
    <clipPath id="imgFrame">
      <rect x="240" y="240" width="840" height="540" />
    </clipPath>
  </defs>

  <!-- FONDO -->
  <rect width="1080" height="1080" class="bg-yellow" />

  <!-- GRILLA BRUTALISTA / ESTRUCTURA -->
  <!-- Marco principal -->
  <rect x="20" y="20" width="1040" height="1040" class="stroke" />
  
  <!-- Línea divisoria vertical izquierda (para el título rotado) -->
  <line x1="180" y1="20" x2="180" y2="1060" />
  
  <!-- Línea divisoria horizontal inferior -->
  <line x1="180" y1="840" x2="1060" y2="840" />

  <!-- Línea horizontal superior (logo) -->
  <line x1="180" y1="120" x2="1060" y2="120" />

  <!-- TÍTULO VERTICAL ENORME -->
  <g transform="translate(130, 960) rotate(-90)">
    <text x="0" y="0" font-family="Montserrat, sans-serif" font-size="125" font-weight="900" class="text-teal" letter-spacing="18">CONSOLAS</text>
  </g>

  <!-- SECCIÓN SUPERIOR: Logo y Slogan -->
  <text x="220" y="85" font-family="Montserrat, sans-serif" font-size="46" font-weight="900" class="text-teal" letter-spacing="-1">gadget</text>
  <text x="500" y="78" font-family="Montserrat, sans-serif" font-size="18" font-weight="700" class="text-teal" letter-spacing="4">ESPECIALISTAS EN REPARACIÓN</text>

  <!-- SECCIÓN IMAGEN CENTRAL -->
  <!-- Fondo de la imagen (un rectángulo con trama o color offset) -->
  <rect x="240" y="260" width="760" height="540" class="bg-teal" opacity="0.05" />
  <image href="./controller.png" x="200" y="160" width="880" height="880" class="multiply" preserveAspectRatio="xMidYMid meet" />

  <!-- Texto superpuesto a la imagen (Slogan) -->
  <rect x="180" y="740" width="460" height="60" class="bg-teal" />
  <text x="220" y="778" font-family="Montserrat, sans-serif" font-size="24" font-weight="700" font-style="italic" class="text-yellow" letter-spacing="1">Tu consola, de vuelta en el juego.</text>

  <!-- LISTA DE SERVICIOS (Bloque izquierdo arriba tapando la imagen parcialmente) -->
  <rect x="180" y="120" width="420" height="420" class="bg-yellow" />
  <rect x="180" y="120" width="420" height="420" class="stroke" />
  
  <text x="210" y="170" font-family="Montserrat, sans-serif" font-size="16" font-weight="900" class="text-teal" letter-spacing="2">SERVICIOS DESTACADOS</text>

  <!-- Servicio 1 -->
  <text x="210" y="220" font-family="Montserrat, sans-serif" font-size="20" font-weight="700" class="text-teal">Reparación de joystick</text>
  <text x="210" y="240" font-family="Montserrat, sans-serif" font-size="14" font-weight="400" class="text-teal">Drift, botones y gatillos</text>

  <!-- Servicio 2 -->
  <text x="210" y="280" font-family="Montserrat, sans-serif" font-size="20" font-weight="700" class="text-teal">Cambio lectora / HDD</text>
  <text x="210" y="300" font-family="Montserrat, sans-serif" font-size="14" font-weight="400" class="text-teal">PlayStation · Xbox · Nintendo</text>

  <!-- Servicio 3 -->
  <text x="210" y="340" font-family="Montserrat, sans-serif" font-size="20" font-weight="700" class="text-teal">Limpieza y pasta térmica</text>
  <text x="210" y="360" font-family="Montserrat, sans-serif" font-size="14" font-weight="400" class="text-teal">Ventilador ruidoso · calentamiento</text>

  <!-- Servicio 4 -->
  <text x="210" y="400" font-family="Montserrat, sans-serif" font-size="20" font-weight="700" class="text-teal">Placa base y HDMI / Carga</text>
  <text x="210" y="420" font-family="Montserrat, sans-serif" font-size="14" font-weight="400" class="text-teal">Micro-soldadura, sin imagen/carga</text>

  <!-- SECCIÓN INFERIOR: Contacto y Beneficios -->
  <!-- Bloque WA -->
  <rect x="180" y="840" width="460" height="220" class="bg-teal" />
  <rect x="180" y="840" width="460" height="220" class="stroke" />
  
  <!-- Icono y numero -->
  <rect x="220" y="890" width="80" height="80" rx="20" class="bg-yellow" />
  <text x="260" y="944" font-family="Arial" font-size="46" class="text-teal" text-anchor="middle" font-weight="900">✆</text>
  
  <text x="320" y="920" font-family="Montserrat, sans-serif" font-size="16" font-weight="700" class="text-yellow" letter-spacing="1">ESCRIBINOS POR WHATSAPP</text>
  <text x="320" y="960" font-family="Montserrat, sans-serif" font-size="42" font-weight="900" class="text-yellow">381 565‑8239</text>

  <!-- Bloque Beneficios -->
  <rect x="640" y="840" width="420" height="220" class="bg-yellow" />
  
  <text x="680" y="890" font-family="Montserrat, sans-serif" font-size="18" font-weight="700" class="text-teal">✓ Diagnóstico sin cargo</text>
  <text x="680" y="930" font-family="Montserrat, sans-serif" font-size="18" font-weight="700" class="text-teal">✓ Repuestos originales</text>
  <text x="680" y="970" font-family="Montserrat, sans-serif" font-size="18" font-weight="700" class="text-teal">✓ Garantía por el trabajo</text>
  <text x="680" y="1010" font-family="Montserrat, sans-serif" font-size="18" font-weight="700" class="text-teal">✓ Turno en el día</text>

</svg>
