<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800;900&amp;display=swap');
      .bg-yellow { fill: #ffe66d; }
      .text-teal { fill: #1a535c; }
      .text-white { fill: #ffffff; }
      .bg-teal { fill: #1a535c; }
      .blend-multiply { mix-blend-mode: multiply; }
      .text-shadow { font-family: Montserrat, sans-serif; font-size: 85px; font-weight: 900; letter-spacing: -2px; }
      .title-main { font-family: Montserrat, sans-serif; font-size: 85px; font-weight: 900; letter-spacing: -2px; }
    </style>
    <filter id="shadowGlow">
      <feDropShadow dx="0" dy="6" stdDeviation="15" flood-color="#1a535c" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- FONDO BASE -->
  <rect width="1080" height="1080" class="bg-yellow" />

  <!-- DECORACIÓN CIRCULAR (Sutil) -->
  <circle cx="950" cy="150" r="300" fill="#1a535c" opacity="0.05" />
  <circle cx="100" cy="950" r="400" fill="#1a535c" opacity="0.05" />

  <!-- LOGO GADGET EN LA ESQUINA -->
  <g transform="translate(40, 40)">
    <!-- Simulación del logo G del Instagram -->
    <circle cx="45" cy="45" r="45" class="bg-teal" />
    <text x="45" y="66" font-family="Montserrat, sans-serif" font-size="60" font-weight="900" class="text-white" text-anchor="middle">G</text>
    <!-- Texto Gadget -->
    <text x="110" y="55" font-family="Montserrat, sans-serif" font-size="28" font-weight="900" class="text-teal" letter-spacing="1">gadget</text>
  </g>

  <!-- TÍTULO PRINCIPAL GIGANTE (ESTILO INSTAGRAM) -->
  <!-- "¿Tu consola está..." -->
  <text x="70" y="240" font-family="Montserrat, sans-serif" font-size="65" font-weight="700" class="text-teal" letter-spacing="-1">¿Tu consola está</text>
  
  <!-- "...en las últimas?" -->
  <text x="70" y="325" font-family="Montserrat, sans-serif" font-size="75" font-weight="900" class="text-teal" letter-spacing="-2">en las últimas?</text>
  
  <!-- SUBTÍTULO LLAMATIVO -->
  <rect x="70" y="360" width="540" height="80" rx="15" class="bg-teal" filter="url(#shadowGlow)"/>
  <text x="340" y="415" font-family="Montserrat, sans-serif" font-size="38" font-weight="800" class="text-yellow" letter-spacing="1" text-anchor="middle">¡NOSOTROS LA REVIVIMOS!</text>

  <!-- IMAGEN CENTRAL GIGANTE Y ROTADA -->
  <!-- El control de PS5 toma protagonismo ocupando el centro/derecha -->
  <!-- Usamos multiply para integrarlo perfectamente al amarillo -->
  <image href="./controller.png" x="250" y="350" width="850" height="850" preserveAspectRatio="xMidYMid meet" class="blend-multiply" transform="rotate(-15 675 775)" />

  <!-- TEXTO DE SERVICIOS (Al grano, sin listas largas) -->
  <text x="70" y="580" font-family="Montserrat, sans-serif" font-size="32" font-weight="800" class="text-teal">▸ Reparación de Joystick</text>
  <text x="70" y="640" font-family="Montserrat, sans-serif" font-size="32" font-weight="800" class="text-teal">▸ Mantenimiento y Limpieza</text>
  <text x="70" y="700" font-family="Montserrat, sans-serif" font-size="32" font-weight="800" class="text-teal">▸ Placa y Conectores</text>

  <!-- BANNER CONTACTO INFERIOR (Estilo similar al feed) -->
  <!-- Bloque que imita la info del feed -->
  
  <text x="540" y="880" font-family="Montserrat, sans-serif" font-size="30" font-weight="700" class="text-teal" text-anchor="middle">Contactanos por WhatsApp:</text>
  
  <rect x="540" y="910" width="80" height="80" rx="20" fill="#25D366" transform="translate(-250, 0)" />
  <path d="M330,935 c-1.6-4.5-3.3-4.6-4.8-4.7c-1.3-0.1-2.7-0.1-4.1-0.1c-1.4,0-3.6,0.5-5.5,2.6c-1.8,2.1-7.1,7-7.1,17 c0,10.1,7.3,19.8,8.3,21.2c1,1.4,14.4,22,34.9,30.8c4.9,2.1,8.7,3.4,11.7,4.3c4.9,1.6,9.4,1.4,12.9,0.8 c4.1-0.6,12.5-5.1,14.3-10.1c1.8-5,1.8-9.2,1.3-10.1c-0.5-1-1.8-1.5-3.9-2.6c-2.1-1-12.5-6.2-14.4-6.9c-1.9-0.7-3.3-1-4.8,1.2 c-1.4,2.2-5.5,6.9-6.7,8.3c-1.2,1.4-2.5,1.6-4.5,0.5c-2.1-1-8.9-3.3-17-10.5c-6.3-5.6-10.5-12.5-11.8-14.6 c-1.2-2.1-0.1-3.3,1-4.3c1-0.9,2.1-2.5,3.1-3.7c1-1.3,1.4-2.2,2.1-3.6c0.7-1.4,0.3-2.7-0.2-3.7C334,942.3,330,932.6,330,935z" fill="#ffffff" />
  
  <text x="580" y="968" font-family="Montserrat, sans-serif" font-size="60" font-weight="900" class="text-teal" text-anchor="middle">381 565-8239</text>

  <!-- LÍNEA FINAL con Plataformas -->
  <line x1="70" y1="1020" x2="1010" y2="1020" stroke="#1a535c" stroke-width="2" opacity="0.2"/>
  <text x="540" y="1050" font-family="Montserrat, sans-serif" font-size="16" font-weight="700" class="text-teal" opacity="0.5" text-anchor="middle" letter-spacing="2">PlayStation · Xbox · Nintendo</text>

</svg>
